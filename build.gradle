plugins {
    id "org.jetbrains.kotlin.jvm" version "2.1.10"
    id "org.jetbrains.kotlin.plugin.serialization" version "2.1.10"
    id "application"
}

group = "com.leetcode.tracker"
version = "1.0.0"

repositories {
    mavenCentral()
}

def ktorVersion = "2.3.12"
def exposedVersion = "0.55.0"

dependencies {
    implementation "io.ktor:ktor-server-core-jvm:$ktorVersion"
    implementation "io.ktor:ktor-server-netty-jvm:$ktorVersion"
    implementation "io.ktor:ktor-server-content-negotiation-jvm:$ktorVersion"
    implementation "io.ktor:ktor-serialization-kotlinx-json-jvm:$ktorVersion"
    implementation "io.ktor:ktor-server-auth-jvm:$ktorVersion"
    implementation "io.ktor:ktor-server-auth-jwt-jvm:$ktorVersion"
    implementation "io.ktor:ktor-server-status-pages-jvm:$ktorVersion"
    implementation "io.ktor:ktor-server-call-logging-jvm:$ktorVersion"

    implementation "io.ktor:ktor-client-core-jvm:$ktorVersion"
    implementation "io.ktor:ktor-client-cio-jvm:$ktorVersion"
    implementation "io.ktor:ktor-client-content-negotiation-jvm:$ktorVersion"

    implementation "org.jetbrains.exposed:exposed-core:$exposedVersion"
    implementation "org.jetbrains.exposed:exposed-dao:$exposedVersion"
    implementation "org.jetbrains.exposed:exposed-jdbc:$exposedVersion"
    implementation "org.jetbrains.exposed:exposed-java-time:$exposedVersion"

    implementation "org.postgresql:postgresql:42.7.4"
    implementation "com.zaxxer:HikariCP:5.1.0"

    implementation "com.auth0:java-jwt:4.4.0"
    implementation "at.favre.lib:bcrypt:0.10.2"

    implementation "ch.qos.logback:logback-classic:1.5.12"

    testImplementation "io.ktor:ktor-server-tests-jvm:$ktorVersion"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:2.1.10"
}

application {
    mainClass = "com.leetcode.tracker.application.ApplicationKt"
}

kotlin {
    jvmToolchain(21)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named("run", JavaExec).configure {
    environment "DATABASE_URL", System.getenv("DATABASE_URL") ?: "jdbc:postgresql://localhost:5432/leetcode_tracker"
    environment "DATABASE_USER", System.getenv("DATABASE_USER") ?: "tracker"
    environment "DATABASE_PASSWORD", System.getenv("DATABASE_PASSWORD") ?: "tracker"
    environment "JWT_SECRET", System.getenv("JWT_SECRET") ?: "dev-only-secret-change-me-please-use-32chars-minimum!!"
}
