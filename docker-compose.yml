services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leetcode_tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d leetcode_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/leetcode_tracker
      DATABASE_USER: tracker
      DATABASE_PASSWORD: tracker
      JWT_SECRET: change-me-in-production-use-a-long-random-secret-string
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: {}
